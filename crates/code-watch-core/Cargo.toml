[package]
name = "code-watch-core"
description = "Detection engine of code-watch: findings, rules and the repo and command checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
globset = "0.4.21"
idna = "1.1.0"
ignore = "0.4.34"
psl = "2.1.252"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shlex = "2.0.1"
strsim = "0.11.1"
thiserror = "2.0.21"
toml = "1.2.1"
unicode-general-category = "1.1.0"
unicode-security = "0.1.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
