[package]
name = "code-watch"
description = "Local guard that checks a developer's machine before risky code runs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
rustix = { version = "1.1.6", features = ["process"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shlex = "2.0.1"
code-watch-core = { version = "0.1.0", path = "../code-watch-core" }

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
serde_norway = "0.9.42"
